      "id": "ent-overlook", "expression": "overlook a factor/detail", "normalized_expression": "overlook a factor/detail", "type": "collocation", "sense_id": "fail-to-notice",
      "meaning_zh": "忽略某個因素／細節", "definition_en": "to fail to notice or consider an important factor or detail", "ipa": "/ˌəʊvəˈlʊk/", "stress_note": "Verb stress is on LOOK.", "core_sense": "Something relevant escapes attention.", "nuance": "Often used when explaining an error in analysis.", "register": "neutral", "domains": ["Business", "Academic"], "collocations": ["overlook a key factor", "overlook an important detail"], "contrast": "ignore can be deliberate; overlook is usually accidental.", "examples": ["The initial analysis overlooked a key cost factor."], "frame": "overlook + factor / detail / risk", "status": "Passive → Active", "save_reason": "Useful in case analysis and feedback.", "favorite": false, "notes": "", "encounters": [{ "date": "2026-09-25", "source_id": "src-random", "source_quote": "The model may overlook an important detail.", "context_note": "High-value correction." }], "review": { "enabled": true, "mode": "standard", "interval": 0, "ease": 2.5, "next_review": "2026-09-25", "last_review": "", "review_count": 0 }, "created_at": "2026-09-25T06:20:00.000Z", "updated_at": "2026-09-25T06:20:00.000Z"
    },
    {
      "id": "ent-brittle", "expression": "brittle", "normalized_expression": "brittle", "type": "word", "sense_id": "hard-breaks-easily",
      "meaning_zh": "脆的；缺乏韌性、容易崩解的", "definition_en": "hard but likely to break, or unable to adapt under pressure", "ipa": "/ˈbrɪtəl/", "stress_note": "One strong first syllable: BRIT-tle.", "core_sense": "Apparent strength without flexibility.", "nuance": "Works literally for materials and metaphorically for systems or plans.", "register": "neutral", "domains": ["Academic", "Business", "Daily"], "collocations": ["brittle bones", "brittle system", "brittle strategy"], "contrast": "fragile is broadly easy to damage; brittle specifically lacks flexibility.", "examples": ["The strategy looked efficient, but it was brittle under unexpected pressure."], "frame": "a brittle + material / system / strategy", "status": "Useful", "save_reason": "Its literal and metaphorical uses are worth keeping.", "favorite": false, "notes": "", "encounters": [{ "date": "2026-09-25", "source_id": "src-random", "source_quote": "brittle bones of truths", "context_note": "Meaning, pronunciation, and metaphorical use." }], "review": { "enabled": false, "mode": "off", "interval": 0, "ease": 2.5, "next_review": "", "last_review": "", "review_count": 0 }, "created_at": "2026-09-25T06:30:00.000Z", "updated_at": "2026-09-25T06:30:00.000Z"
    }
  ],
  "review_history": [],
  "import_review_queue": []
}
</script>
<div class="app">
  <header class="topbar"><div class="top-inner"><div class="brand"><div class="mark">ED</div><div><h1>English Daily</h1><small>Active English Notebook</small></div></div><div class="top-actions"><button class="btn soft sm" data-open="quick">＋ Quick Add</button><button class="icon-btn" data-open="settings" aria-label="Settings">⚙</button></div></div></header>
  <nav class="bottom-nav" aria-label="Main navigation"><div class="nav-inner">
    <button class="nav-btn active" data-view="daily"><span class="ni">◫</span>Daily</button><button class="nav-btn" data-view="library"><span class="ni">▤</span>Library</button><button class="nav-btn" data-view="sources"><span class="ni">⌁</span>Sources</button><button class="nav-btn" data-view="review"><span class="ni">↻</span>Review</button>
  </div></nav>
  <main><section id="daily" class="view active"></section><section id="library" class="view"></section><section id="sources" class="view"></section><section id="review" class="view"></section></main>
</div>
<input id="importFile" class="hidden" type="file" accept="application/json,.json"><input id="restoreFile" class="hidden" type="file" accept="application/json,.json">
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='englishDaily.v2';
const TYPES=['word','collocation','phrase','phrasal verb','term','sentence frame','structure','discourse marker','high-value correction'];
const STATUSES=['Recognition','Useful','Passive → Active','Active Target'];
const REGISTERS=['casual','neutral','formal','academic','literary'];
const SOURCE_TYPES=['Article','Book','Class','Coursera','Conversation','Random Sentence','Video','Other'];
const PROMPTS=['Meaning Recall','Situation Recall','Frame Recall','Chinese→English','Personal-Business Transfer','Pronunciation'];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clone=x=>JSON.parse(JSON.stringify(x));
const seed=JSON.parse($('#seed').textContent);
let data=load();
let state={view:'daily',selectedDate:latestDate(),query:'',filters:{type:'',status:'',domain:'',register:'',favorite:false,due:false,date:'',source:''},reviewIndex:0,revealed:false,reviewQueue:[]};

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.entries)?migrate(x):clone(seed)}catch(e){return clone(seed)}}
function migrate(x){x.settings=x.settings||clone(seed.settings);x.sources=x.sources||[];x.entries=(x.entries||[]).map(normalizeEntry);x.review_history=x.review_history||[];x.import_review_queue=x.import_review_queue||[];x.schema_version='2.1.0';x.app='English Daily';return x}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toLocaleDateString('en-CA')}
function parseDate(s){return new Date(s+'T12:00:00')}
function addDays(date,n){const d=parseDate(date||today());d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function fmt(date){if(!date)return '—';if(data.settings.date_format==='iso')return date;const opt=data.settings.date_format==='long'?{year:'numeric',month:'long',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'};return parseDate(date).toLocaleDateString('en-US',opt)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function normalizeEntry(e){const legacyPron=e.status==='Pronunciation Target';const expression=e.expression||'';const type=e.type==='pronunciation target'?(norm(expression).includes(' ')?'phrase':'word'):(e.type||'word');const status=legacyPron?'Useful':(e.status||'Useful');const n={id:e.id||uid('ent'),expression,normalized_expression:norm(expression),type,sense_id:e.sense_id||slug(e.meaning_zh||e.definition_en||'general'),meaning_zh:e.meaning_zh||'',definition_en:e.definition_en||'',ipa:e.ipa||'',stress_note:e.stress_note||'',core_sense:e.core_sense||'',nuance:e.nuance||'',register:e.register||'neutral',domains:e.domains||[],collocations:e.collocations||[],contrast:e.contrast||'',examples:e.examples||[],frame:e.frame||'',status,save_reason:e.save_reason||'',favorite:!!e.favorite,notes:e.notes||'',encounters:e.encounters||[],review:e.review||{},created_at:e.created_at||new Date().toISOString(),updated_at:e.updated_at||new Date().toISOString()};n.review=Object.assign({enabled:['Passive → Active','Active Target'].includes(n.status),mode:['Passive → Active','Active Target'].includes(n.status)?'standard':'off',interval:0,ease:2.5,next_review:['Passive → Active','Active Target'].includes(n.status)?today():'',last_review:'',review_count:0},n.review);if(legacyPron){n.review.enabled=false;n.review.mode='off';n.review.next_review=''}return n}
function slug(s){return norm(s).replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').slice(0,42)||'general'}
function latestDate(){const dates=(data.entries||[]).flatMap(e=>e.encounters.map(x=>x.date)).filter(Boolean).sort();return dates.at(-1)||today()}
function encounterCount(e){return e.encounters.length}
function firstEncounter(e){return [...e.encounters].sort((a,b)=>a.date.localeCompare(b.date))[0]}
function isDue(e){return e.review?.enabled&&e.review.next_review&&e.review.next_review<=today()}
function sourceName(id){return data.sources.find(s=>s.id===id)?.title||'No source'}
function statusClass(s){if(s==='Active Target')return 'purple';if(s==='Passive → Active')return 'blue';if(s==='Useful')return 'sage';return ''}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2400)}
function iconFor(type){return ({Article:'A',Book:'B',Class:'C',Coursera:'C',Conversation:'↔','Random Sentence':'R',Video:'▶',Other:'•'})[type]||'•'}

function render(){renderStatsData();renderDaily();renderLibrary();renderSources();renderReview();bindDynamic()}
function renderStatsData(){data.entries.forEach(e=>{e.normalized_expression=norm(e.expression)})}
function statsHTML(){const active=data.entries.filter(e=>['Active Target','Passive → Active'].includes(e.status)).length;return `<div class="stats"><div class="stat"><b>${data.entries.length}</b><span>Library</span></div><div class="stat"><b>${active}</b><span>Active</span></div><div class="stat"><b>${data.entries.filter(isDue).length}</b><span>Due</span></div><div class="stat"><b>${data.entries.filter(e=>e.encounters.some(x=>x.date===state.selectedDate)).length}</b><span>Added / seen</span></div></div>`}
function renderDaily(){const entries=data.entries.filter(e=>e.encounters.some(x=>x.date===state.selectedDate));const groups=[['Active',['Active Target','Passive → Active']],['Useful',['Useful','Recognition']]];$('#daily').innerHTML=`<div class="page-head"><div><div class="eyebrow">Daily view</div><h2>${fmt(state.selectedDate)}</h2><p class="lede">這一天遇到的英文；重複出現會更新原卡，不會建立第二張。</p></div><div class="date-switcher"><button class="icon-btn" data-day="-1" aria-label="Previous day">‹</button><button class="date-main" data-open-calendar>${fmt(state.selectedDate)} ▾</button><input id="dayPicker" class="date-input" type="date" value="${state.selectedDate}"><button class="icon-btn" data-day="1" aria-label="Next day">›</button></div></div>${statsHTML()}${groups.map(([title,statuses])=>sectionCards(title,entries.filter(e=>statuses.includes(e.status)),true)).join('')}${renderDailySources()}`}
function sectionCards(title,items,daily=false){return `<section class="section"><div class="section-title"><h3>${title}</h3><span>${items.length} ${items.length===1?'item':'items'}</span></div>${items.length?`<div class="card-grid">${items.map(e=>cardHTML(e,daily)).join('')}</div>`:`<div class="empty">這一天沒有 ${esc(title)} 項目。</div>`}</section>`}
function renderDailySources(){const src=data.sources.filter(s=>s.date===state.selectedDate||data.entries.some(e=>e.encounters.some(x=>x.date===state.selectedDate&&x.source_id===s.id)));return `<section class="section"><div class="section-title"><h3>Sources</h3><span>${src.length} sources</span></div>${src.length?`<div class="source-list">${src.map(sourceHTML).join('')}</div>`:'<div class="empty">這一天沒有來源紀錄。</div>'}</section>`}
function cardHTML(e,daily=false){const enc=[...e.encounters].filter(x=>!daily||x.date===state.selectedDate).sort((a,b)=>a.date.localeCompare(b.date));const first=firstEncounter(e);const sameDayFirst=enc.some(x=>x===first)||first?.date===state.selectedDate;const badge=daily?`<span class="encounter-badge ${sameDayFirst?'':'again'}">${sameDayFirst?'● First encounter':`↺ Seen again · ${encounterCount(e)} encounters`}</span>`:'';return `<article class="entry-card" data-entry="${esc(e.id)}"><div class="card-top"><div class="card-title"><h3>${esc(e.expression)}</h3>${e.ipa?`<div class="meaning">${esc(e.ipa)}</div>`:''}</div><div class="card-actions"><button class="mini" data-speak-expression="${esc(e.expression)}" aria-label="Play pronunciation for ${esc(e.expression)}">◖)</button><button class="mini fav ${e.favorite?'on':''}" data-fav="${esc(e.id)}" aria-label="Favorite">★</button></div></div><div class="meta"><span class="chip">${esc(e.type)}</span><span class="chip ${statusClass(e.status)}">${esc(e.status)}</span>${e.domains.slice(0,3).map(d=>`<span class="chip">${esc(d)}</span>`).join('')}</div>${badge}<p class="meaning">${esc(e.meaning_zh)}</p>${e.examples[0]?`<div class="example" data-speak-text="${esc(e.examples[0])}" role="button" tabindex="0" aria-label="Play example audio">${esc(e.examples[0])}</div>`:''}<details class="details"><summary>Details & history</summary><div class="details-body">${detail('Definition',e.definition_en)}${detail('Core sense',e.core_sense)}${detail('Nuance',e.nuance)}${detail('Frame',e.frame)}${detail('Collocations',e.collocations,'pills')}${detail('Contrast',e.contrast)}${detail('Stress',e.stress_note)}${detail('Notes',e.notes)}<div class="detail-row"><b>Encounter history · ${encounterCount(e)}</b><div class="history">${e.encounters.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="history-item"><b>${fmt(x.date)} · ${esc(sourceName(x.source_id))}</b><div>${esc(x.source_quote)}</div>${x.context_note?`<div class="meaning">${esc(x.context_note)}</div>`:''}</div>`).join('')}</div></div><div class="card-actions"><button class="btn sm" data-copy="${esc(e.id)}">Copy for AI</button><button class="btn sm" data-review-now="${esc(e.id)}">Review now</button></div></div></details></article>`}
function detail(label,value,kind){if(!value||(Array.isArray(value)&&!value.length))return '';return `<div class="detail-row"><b>${label}</b>${kind==='pills'?`<div class="pills">${value.map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div>`:`<p>${esc(value)}</p>`}</div>`}

function filteredEntries(){const f=state.filters,q=norm(state.query);return data.entries.filter(e=>{const hay=norm([e.expression,e.meaning_zh,e.definition_en,e.notes,e.core_sense,e.nuance,e.frame,...e.examples,...e.collocations].join(' '));return(!q||hay.includes(q))&&(!f.type||e.type===f.type)&&(!f.status||e.status===f.status)&&(!f.domain||e.domains.includes(f.domain))&&(!f.register||e.register===f.register)&&(!f.favorite||e.favorite)&&(!f.due||isDue(e))&&(!f.date||e.encounters.some(x=>x.date===f.date))&&(!f.source||e.encounters.some(x=>x.source_id===f.source))})}
function renderLibrary(){const items=filteredEntries(),f=state.filters;const chips=[['type',f.type],['status',f.status],['domain',f.domain],['register',f.register],['favorite',f.favorite?'Favorites':''],['due',f.due?'Due':''],['date',f.date],['source',f.source?sourceName(f.source):'']].filter(x=>x[1]);$('#library').innerHTML=`<div class="page-head"><div><div class="eyebrow">All knowledge</div><h2>Library</h2><p class="lede">搜尋英文、中文、例句或筆記；用篩選器把同一座知識庫變成不同 handbook。</p></div><div class="head-actions"><button class="btn" data-open="filter">Filter ${chips.length?`(${chips.length})`:''}</button></div></div><div class="library-tools"><div class="search-row"><div class="search"><label class="sr-only" for="librarySearch">Search library</label><input id="librarySearch" value="${esc(state.query)}" placeholder="Search expressions, meanings, examples, notes…"></div><button class="btn" data-open="filter">☷ <span class="hide-mobile">Filters</span></button></div><div class="active-filters">${chips.map(([k,v])=>`<button class="filter-pill" data-clear-filter="${k}">${esc(v)} ×</button>`).join('')}</div></div><div class="result-line"><span>${items.length} of ${data.entries.length} entries</span>${state.query||chips.length?'<button class="btn sm" data-clear-all>Clear all</button>':''}</div>${items.length?`<div class="card-grid">${items.map(e=>cardHTML(e)).join('')}</div>`:'<div class="empty"><b>No matching entries.</b><br>Try removing one filter or using a broader search.</div>'}`}

function sourceHTML(s){const linked=data.entries.filter(e=>e.encounters.some(x=>x.source_id===s.id));return `<article class="source-card"><div class="source-icon">${iconFor(s.type)}</div><div><h3>${esc(s.title)}</h3><div class="meta"><span class="chip sage">${esc(s.type)}</span><span class="chip">${fmt(s.date)}</span>${s.full_text?'<span class="chip purple">Full text saved</span>':''}</div>${s.excerpt?`<p>“${esc(s.excerpt)}”</p>`:''}${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">Open source ↗</a>`:''}<div class="source-entries">${linked.map(e=>`<span class="chip">${esc(e.expression)}</span>`).join('')}</div>${s.full_text?`<details><summary>Saved full text</summary><div class="full-text">${esc(s.full_text)}</div></details>`:''}</div><button class="btn sm" data-source-filter="${esc(s.id)}">View ${linked.length}</button></article>`}
function renderSources(){const src=[...data.sources].sort((a,b)=>b.date.localeCompare(a.date));$('#sources').innerHTML=`<div class="page-head"><div><div class="eyebrow">Input history</div><h2>Sources</h2><p class="lede">預設只保存標題、連結、日期與摘錄；全文只有在你主動填入時保存。</p></div><button class="btn" data-open="source">＋ Add source</button></div>${src.length?`<div class="source-list">${src.map(sourceHTML).join('')}</div>`:'<div class="empty">還沒有來源。Quick Add 新卡時也能先選擇既有來源。</div>'}`}

function buildReviewQueue(force){if(force){const e=data.entries.find(x=>x.id===force);state.reviewQueue=e?[e]:[]}else state.reviewQueue=data.entries.filter(isDue).sort((a,b)=>a.review.next_review.localeCompare(b.review.next_review));state.reviewIndex=0;state.revealed=false}
function promptFor(e){const available=e.ipa||e.stress_note?PROMPTS:PROMPTS.filter(x=>x!=='Pronunciation');const type=available[e.review.review_count%available.length];const prompt={
  'Meaning Recall':`What does “${e.expression}” mean? Explain the nuance, not just a translation.`,
  'Situation Recall':`You need this idea in a ${e.domains[0]||'real-life'} situation. What expression would you use? Hint: ${e.meaning_zh}`,
  'Frame Recall':e.frame?`Complete and say this frame naturally: ${e.frame.replace(new RegExp(e.expression.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____')}`:`Recall a natural sentence pattern using: ${e.expression}`,
  'Chinese→English':`用自然英文表達：${e.meaning_zh}`,
  'Personal-Business Transfer':`Use “${e.expression}” in a sentence about your own work, study, or a business decision.`,
  'Pronunciation':`Say “${e.expression}” aloud. Where is the stress? Then listen and compare.`}[type];return{type,prompt}}
function renderReview(){if(!state.reviewQueue.length&&state.reviewIndex===0)buildReviewQueue();const e=state.reviewQueue[state.reviewIndex];const root=$('#review');if(!e){root.innerHTML=`<div class="page-head"><div><div class="eyebrow">Spaced retrieval</div><h2>Review</h2><p class="lede">Active Target 與 Passive → Active 會自動排程。</p></div></div><div class="review-shell"><div class="queue-end"><h3>All clear</h3><p>目前沒有到期項目。Recognition 與 Useful 預設不會塞進佇列。</p><button class="btn" data-review-all>Review active items anyway</button></div></div>`;return}const p=promptFor(e),pct=Math.round(state.reviewIndex/state.reviewQueue.length*100);root.innerHTML=`<div class="page-head"><div><div class="eyebrow">Spaced retrieval</div><h2>Review</h2><p class="lede">${state.reviewIndex+1} of ${state.reviewQueue.length} · ${esc(e.status)}</p></div><button class="btn sm" data-exit-review>Exit</button></div><div class="review-shell"><div class="review-progress"><i style="width:${pct}%"></i></div><article class="review-card"><div class="prompt-type">${esc(p.type)}</div><div class="review-prompt">${esc(p.prompt)}</div>${p.type==='Pronunciation'?`<button class="btn soft" data-speak-text="${esc(e.expression)}">Listen and compare</button>`:''}${state.revealed?`<div class="review-answer"><b>${esc(e.expression)}</b><p>${esc(e.meaning_zh)}</p>${e.definition_en?`<p>${esc(e.definition_en)}</p>`:''}${e.examples[0]?`<div class="example" data-speak-text="${esc(e.examples[0])}" role="button" tabindex="0" aria-label="Play example audio">${esc(e.examples[0])}</div>`:''}</div><div class="rating-row">${ratingButton('Again','1d','again')}${ratingButton('Hard',`${previewInterval(e,'Hard')}d`,'hard')}${ratingButton('Good',`${previewInterval(e,'Good')}d`,'good')}${ratingButton('Easy',`${previewInterval(e,'Easy')}d`,'easy')}</div>`:'<button class="btn primary wide" data-reveal>Reveal answer</button>'}</article></div>`}
function ratingButton(label,days,cls){return `<button class="rating ${cls}" data-rate="${label}">${label}<small>${days}</small></button>`}
function previewInterval(e,rating){const old=e.review.interval||0;if(rating==='Again')return data.settings.review_defaults.again;if(rating==='Hard')return Math.max(data.settings.review_defaults.hard,Math.round(old*1.2));if(rating==='Good')return Math.max(data.settings.review_defaults.good,Math.round(Math.max(1,old)*e.review.ease));return Math.max(data.settings.review_defaults.easy,Math.round(Math.max(1,old)*e.review.ease*1.5))}
function rate(rating){const e=state.reviewQueue[state.reviewIndex],prev=e.review.interval||0,promptType=promptFor(e).type;let next=previewInterval(e,rating);if(rating==='Again'){e.review.ease=Math.max(1.3,e.review.ease-.2)}else if(rating==='Hard'){e.review.ease=Math.max(1.3,e.review.ease-.05)}else if(rating==='Easy'){e.review.ease=Math.min(3,e.review.ease+.1)}e.review.interval=next;e.review.last_review=today();e.review.next_review=addDays(today(),next);e.review.review_count++;data.review_history.push({entry_id:e.id,date:new Date().toISOString(),rating,prompt_type:promptType,previous_interval:prev,new_interval:next});save();state.reviewIndex++;state.revealed=false;renderReview();bindDynamic()}

function bindDynamic(){
  $$('[data-day]').forEach(b=>b.onclick=()=>{state.selectedDate=addDays(state.selectedDate,+b.dataset.day);render()});
  $('[data-open-calendar]')?.addEventListener('click',()=>$('#dayPicker').showPicker?.());$('#dayPicker')?.addEventListener('change',e=>{state.selectedDate=e.target.value;render()});
  $('#librarySearch')?.addEventListener('input',e=>{state.query=e.target.value;renderLibrary();bindDynamic()});
  $$('[data-fav]').forEach(b=>b.onclick=()=>{const e=data.entries.find(x=>x.id===b.dataset.fav);e.favorite=!e.favorite;save();render()});
  $$('[data-speak-expression]').forEach(b=>b.onclick=()=>speak(b.dataset.speakExpression));
  $$('[data-speak-text]').forEach(el=>{el.onclick=()=>speak(el.dataset.speakText);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(el.dataset.speakText)}}});
  $$('[data-copy]').forEach(b=>b.onclick=()=>copyAI(data.entries.find(x=>x.id===b.dataset.copy)));
  $$('[data-review-now]').forEach(b=>b.onclick=()=>{buildReviewQueue(b.dataset.reviewNow);go('review')});
  $$('[data-source-filter]').forEach(b=>b.onclick=()=>{state.filters.source=b.dataset.sourceFilter;go('library')});
  $$('[data-clear-filter]').forEach(b=>b.onclick=()=>{state.filters[b.dataset.clearFilter]=['favorite','due'].includes(b.dataset.clearFilter)?false:'';render()});
  $('[data-clear-all]')?.addEventListener('click',()=>{state.query='';state.filters={type:'',status:'',domain:'',register:'',favorite:false,due:false,date:'',source:''};render()});
  $('[data-reveal]')?.addEventListener('click',()=>{state.revealed=true;renderReview();bindDynamic()});$$('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
  $('[data-review-all]')?.addEventListener('click',()=>{state.reviewQueue=data.entries.filter(e=>e.review.enabled);state.reviewIndex=0;state.revealed=false;renderReview();bindDynamic()});
  $('[data-exit-review]')?.addEventListener('click',()=>{state.reviewQueue=[];state.reviewIndex=0;go('daily')});
  $$('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));
}
function speak(text){if(!text)return;if(!('speechSynthesis'in window)){toast('This browser does not support speech playback.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=data.settings.accent;u.rate=.88;speechSynthesis.speak(u)}
async function copyAI(e){const s=sourceName(firstEncounter(e)?.source_id);const text=`Please help me practise this English item.\nExpression: ${e.expression}\nMeaning (ZH): ${e.meaning_zh}\nDefinition: ${e.definition_en}\nStatus: ${e.status}\nDomain: ${e.domains.join(', ')}\nFrame: ${e.frame}\nExample: ${e.examples[0]||''}\nSource: ${s}\nCreate one concise explanation, one contrast, and three retrieval prompts suitable for my status.`;try{await navigator.clipboard.writeText(text);toast('Copied for AI')}catch{xFallback(text)}}
function xFallback(text){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied for AI')}

function go(view){state.view=view;$$('.view').forEach(v=>v.classList.toggle('active',v.id===view));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='review'&&!state.reviewQueue.length)buildReviewQueue();render();window.scrollTo({top:0,behavior:'smooth'})}
$$('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.view));

function modal(title,body,wide=false){$('#modalRoot').innerHTML=`<div class="overlay" data-overlay><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" data-close aria-label="Close">×</button></div>${body}</section></div>`;$('[data-close]').onclick=closeModal;$('[data-overlay]').onclick=e=>{if(e.target.dataset.overlay!==undefined)closeModal()};document.addEventListener('keydown',escClose);setTimeout(()=>$('.modal input,.modal select,.modal button')?.focus(),0)}
function closeModal(){$('#modalRoot').innerHTML='';document.removeEventListener('keydown',escClose)}function escClose(e){if(e.key==='Escape')closeModal()}
function options(arr,current='',empty='All'){return `<option value="">${empty}</option>${arr.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}`}
function openModal(kind){if(kind==='quick')return quickModal();if(kind==='filter')return filterModal();if(kind==='source')return sourceModal();if(kind==='settings')return settingsModal()}
function quickModal(){modal('Quick Add',`<form id="quickForm"><div class="form-grid"><div class="field full"><label>Expression *</label><input name="expression" required placeholder="e.g. account for"></div><div class="field"><label>Type</label><select name="type">${options(TYPES,'phrase','Choose type')}</select></div><div class="field"><label>Status</label><select name="status">${options(STATUSES,'Useful','Choose status')}</select></div><div class="field full"><label>Meaning in Chinese *</label><input name="meaning_zh" required></div><div class="field full"><label>English definition</label><input name="definition_en"></div><div class="field"><label>Domain(s), comma separated</label><input name="domains" placeholder="Business, Classroom"></div><div class="field"><label>Register</label><select name="register">${options(REGISTERS,'neutral','Choose register')}</select></div><div class="field full"><label>Example</label><textarea name="example"></textarea></div><div class="field"><label>Date encountered</label><input name="date" type="date" value="${state.selectedDate||today()}"></div><div class="field"><label>Source</label><select name="source_id">${options(data.sources.map(s=>s.id),'','No source') .replace(/>([^<]+)<\/option>/g,(m,id)=>`>${esc(sourceName(id))}</option>`)}</select></div><div class="field full"><label>Source quote</label><textarea name="source_quote"></textarea></div><div class="field full"><label>Why save it?</label><textarea name="save_reason"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" data-close2>Cancel</button><button class="btn primary">Save entry</button></div></form>`);$('[data-close2]').onclick=closeModal;$('#quickForm').onsubmit=e=>{e.preventDefault();quickAdd(new FormData(e.target))}}
function quickAdd(fd){const raw=Object.fromEntries(fd);const reviewOn=['Passive → Active','Active Target'].includes(raw.status);const incoming=normalizeEntry({id:uid('ent'),expression:raw.expression,type:raw.type,meaning_zh:raw.meaning_zh,definition_en:raw.definition_en,register:raw.register,domains:raw.domains.split(',').map(x=>x.trim()).filter(Boolean),examples:raw.example?[raw.example]:[],status:raw.status,save_reason:raw.save_reason,encounters:[{date:raw.date||today(),source_id:raw.source_id||'',source_quote:raw.source_quote||'',context_note:'Added with Quick Add.'}],review:{enabled:reviewOn,mode:reviewOn?'standard':'off',interval:0,ease:2.5,next_review:reviewOn?(raw.date||today()):'',last_review:'',review_count:0}});const candidates=findCandidates(incoming);if(candidates.exact){mergeEntry(candidates.exact,incoming);save();closeModal();toast('Merged with the existing card and added a new encounter.');render();return}if(candidates.conflicts.length){queueConflict(incoming,candidates.conflicts,'Same normalized expression and type, but the sense or meaning may differ.');save();closeModal();toast('Possible duplicate moved to Import Review.');settingsModal('conflicts');return}data.entries.push(incoming);save();closeModal();state.selectedDate=incoming.encounters[0].date;render();toast('Entry added')}

function filterModal(){const domains=[...new Set(data.entries.flatMap(e=>e.domains))].sort();modal('Filter Library',`<form id="filterForm"><div class="filter-groups"><div class="field"><label>Type</label><select name="type">${options(TYPES,state.filters.type)}</select></div><div class="field"><label>Status</label><select name="status">${options(STATUSES,state.filters.status)}</select></div><div class="field"><label>Domain</label><select name="domain">${options(domains,state.filters.domain)}</select></div><div class="field"><label>Register</label><select name="register">${options(REGISTERS,state.filters.register)}</select></div><div class="field"><label>Date encountered</label><input type="date" name="date" value="${esc(state.filters.date)}"></div><div class="field"><label>Source</label><select name="source">${sourceOptions(state.filters.source)}</select></div><label class="check-row"><input type="checkbox" name="favorite" ${state.filters.favorite?'checked':''}> Favorites only</label><label class="check-row"><input type="checkbox" name="due" ${state.filters.due?'checked':''}> Due for review</label></div><div class="modal-actions"><button type="button" class="btn" data-reset-filter>Reset</button><button class="btn primary">Apply filters</button></div></form>`);$('[data-reset-filter]').onclick=()=>{state.filters={type:'',status:'',domain:'',register:'',favorite:false,due:false,date:'',source:''};closeModal();render()};$('#filterForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.filters={type:f.get('type'),status:f.get('status'),domain:f.get('domain'),register:f.get('register'),favorite:f.has('favorite'),due:f.has('due'),date:f.get('date'),source:f.get('source')};closeModal();render()}}
function sourceOptions(current=''){return `<option value="">All</option>${data.sources.map(s=>`<option value="${esc(s.id)}" ${s.id===current?'selected':''}>${esc(s.title)}</option>`).join('')}`}
function sourceModal(){modal('Add source',`<form id="sourceForm"><div class="form-grid"><div class="field"><label>Type</label><select name="type">${options(SOURCE_TYPES,'Article','Choose type')}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field full"><label>Title *</label><input name="title" required></div><div class="field full"><label>URL</label><input name="url" type="url"></div><div class="field full"><label>Excerpt</label><textarea name="excerpt"></textarea></div><div class="field full"><label>Full text (optional; leave blank by default)</label><textarea name="full_text" placeholder="Only save full text when you intentionally want a complete copy."></textarea></div></div><div class="modal-actions"><button class="btn primary">Save source</button></div></form>`);$('#sourceForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));data.sources.push({id:uid('src'),...x});save();closeModal();render();toast('Source saved')}}

function settingsModal(tab='data'){const q=data.import_review_queue.length;modal('Settings & data',`<div class="form-grid"><div class="field"><label>Voice accent</label><select id="accent"><option value="en-US" ${data.settings.accent==='en-US'?'selected':''}>English — US</option><option value="en-GB" ${data.settings.accent==='en-GB'?'selected':''}>English — UK</option></select></div><div class="field"><label>Date format</label><select id="dateFormat"><option value="medium">Sep 25, 2026</option><option value="long" ${data.settings.date_format==='long'?'selected':''}>September 25, 2026</option><option value="iso" ${data.settings.date_format==='iso'?'selected':''}>2026-09-25</option></select></div></div><div class="section"><div class="section-title"><h3>Data</h3><span>Stored only in this browser</span></div><div class="import-note">Import uses Merge by default. Exact same sense merges safely; possible meaning conflicts wait for your decision.</div><div class="modal-actions" style="justify-content:flex-start"><button class="btn" id="importBtn">Import & merge</button><button class="btn" id="exportBtn">Export JSON</button><button class="btn" id="backupBtn">Full backup</button><button class="btn" id="restoreBtn">Restore backup</button></div></div><div class="section"><div class="section-title"><h3>Import Review</h3><span>${q} waiting</span></div><div id="conflicts">${q?data.import_review_queue.map(conflictHTML).join(''):'<div class="empty">No possible duplicates waiting.</div>'}</div></div><div class="danger-zone"><h3>Danger zone</h3><button class="btn danger" id="replaceBtn">Replace all from JSON…</button> <button class="btn danger" id="resetBtn">Reset to sample data…</button></div>`,true);$('#accent').onchange=e=>{data.settings.accent=e.target.value;save();toast('Accent saved')};$('#dateFormat').onchange=e=>{data.settings.date_format=e.target.value;save();render();toast('Date format saved')};$('#importBtn').onclick=()=>$('#importFile').click();$('#exportBtn').onclick=exportData;$('#backupBtn').onclick=backupData;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#replaceBtn').onclick=()=>confirmReplace();$('#resetBtn').onclick=confirmReset;$$('[data-conflict-action]').forEach(b=>b.onclick=()=>resolveConflict(b.dataset.id,b.dataset.conflictAction))}
function conflictHTML(c){const current=data.entries.filter(e=>c.candidate_ids.includes(e.id));return `<div class="conflict"><h3>${esc(c.incoming.expression)}</h3><p class="meaning">${esc(c.reason)}</p><div class="compare"><div><b>Existing</b><br>${current.map(e=>esc(e.meaning_zh||e.definition_en)).join('<br>')}</div><div><b>Incoming</b><br>${esc(c.incoming.meaning_zh||c.incoming.definition_en)}</div></div><div class="modal-actions"><button class="btn sm" data-conflict-action="merge" data-id="${c.id}">Merge</button><button class="btn sm" data-conflict-action="separate" data-id="${c.id}">Keep separate</button><button class="btn sm danger" data-conflict-action="skip" data-id="${c.id}">Skip</button></div></div>`}
function findCandidates(inc){const same=data.entries.filter(e=>e.normalized_expression===norm(inc.expression)&&e.type===inc.type);const exact=same.find(e=>(e.sense_id&&inc.sense_id&&e.sense_id===inc.sense_id)||(norm(inc.meaning_zh)&&norm(e.meaning_zh)===norm(inc.meaning_zh))||(norm(inc.definition_en)&&norm(e.definition_en)===norm(inc.definition_en)));return{exact,conflicts:exact?[]:same}}
function queueConflict(incoming,candidates,reason){data.import_review_queue.push({id:uid('conflict'),incoming,candidate_ids:candidates.map(e=>e.id),reason})}
function mergeEntry(base,inc){const keepReview=clone(base.review),keepFav=base.favorite,keepCreated=base.created_at;['definition_en','ipa','stress_note','core_sense','nuance','contrast','frame','save_reason','notes'].forEach(k=>{if(!base[k]&&inc[k])base[k]=inc[k]});base.domains=[...new Set([...base.domains,...inc.domains])];base.collocations=[...new Set([...base.collocations,...inc.collocations])];base.examples=[...new Set([...base.examples,...inc.examples])];const seen=new Set(base.encounters.map(encKey));inc.encounters.forEach(x=>{if(!seen.has(encKey(x)))base.encounters.push(x)});base.review=keepReview;base.favorite=keepFav;base.created_at=keepCreated;base.updated_at=new Date().toISOString()}
function encKey(x){return [x.date,x.source_id,norm(x.source_quote),norm(x.context_note)].join('|')}
function resolveConflict(id,action){const c=data.import_review_queue.find(x=>x.id===id);if(!c)return;if(action==='merge'){const base=data.entries.find(e=>e.id===c.candidate_ids[0]);if(base)mergeEntry(base,c.incoming)}else if(action==='separate'){c.incoming.id=uid('ent');data.entries.push(c.incoming)}data.import_review_queue=data.import_review_queue.filter(x=>x.id!==id);save();settingsModal('conflicts');render();toast(action==='skip'?'Incoming entry skipped':action==='merge'?'Entries merged':'Kept as a separate sense')}

async function readJSON(file){const obj=JSON.parse(await file.text());if(obj.backup_format==='english-daily-full-backup')return obj.data;if(!obj||!Array.isArray(obj.entries))throw new Error('This is not an English Daily data file.');return migrate(obj)}
async function importMerge(file){try{const incoming=await readJSON(file);incoming.sources.forEach(s=>{const old=data.sources.find(x=>x.id===s.id);if(!old)data.sources.push(s);else Object.assign(old,{...s,full_text:old.full_text||s.full_text})});let merged=0,added=0,queued=0;incoming.entries.forEach(raw=>{const inc=normalizeEntry(raw),c=findCandidates(inc);if(c.exact){mergeEntry(c.exact,inc);merged++}else if(c.conflicts.length){queueConflict(inc,c.conflicts,'Same normalized expression and type, but the sense or meaning may differ.');queued++}else{if(data.entries.some(e=>e.id===inc.id))inc.id=uid('ent');data.entries.push(inc);added++}});data.review_history=[...data.review_history,...incoming.review_history.filter(x=>!data.review_history.some(y=>JSON.stringify(y)===JSON.stringify(x)))];save();render();toast(`Import complete: ${added} added, ${merged} merged, ${queued} to review.`);if(queued)settingsModal('conflicts')}catch(e){toast(e.message)}}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportData(){data.exported_at=new Date().toISOString();save();download(`english-daily-${today()}.json`,data);toast('Data exported')}
function checksum(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(16)}
function backupData(){const raw=JSON.stringify(data);download(`english-daily-backup-${today()}.json`,{backup_format:'english-daily-full-backup',backup_version:1,created_at:new Date().toISOString(),checksum:checksum(raw),data});toast('Full backup downloaded')}
function confirmReplace(){modal('Replace all data?',`<p>This will replace every current entry, source, setting, and review record. Export a backup first.</p><div class="field"><label>Type <b>REPLACE ALL</b> to continue</label><input id="replacePhrase" autocomplete="off"></div><div class="modal-actions"><button class="btn" data-close2>Cancel</button><button class="btn danger" id="replaceConfirm" disabled>Choose JSON and replace</button></div>`);$('[data-close2]').onclick=closeModal;$('#replacePhrase').oninput=e=>$('#replaceConfirm').disabled=e.target.value!=='REPLACE ALL';$('#replaceConfirm').onclick=()=>{window.replaceMode=true;closeModal();$('#importFile').click()}}
function confirmReset(){modal('Reset to sample data?',`<p>Your current local data will be removed. This cannot be undone unless you export a backup first.</p><div class="field"><label>Type <b>RESET</b> to continue</label><input id="resetPhrase" autocomplete="off"></div><div class="modal-actions"><button class="btn" data-close2>Cancel</button><button class="btn danger" id="resetConfirm" disabled>Reset data</button></div>`);$('[data-close2]').onclick=closeModal;$('#resetPhrase').oninput=e=>$('#resetConfirm').disabled=e.target.value!=='RESET';$('#resetConfirm').onclick=()=>{data=clone(seed);save();state.selectedDate=latestDate();closeModal();render();toast('Reset to sample data')}}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(window.replaceMode){try{data=await readJSON(file);save();state.selectedDate=latestDate();render();toast('All data replaced')}catch(err){toast(err.message)}window.replaceMode=false}else await importMerge(file);e.target.value=''};
$('#restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.backup_format!=='english-daily-full-backup'||!obj.data)throw new Error('Not a full English Daily backup.');if(obj.checksum&&checksum(JSON.stringify(obj.data))!==obj.checksum)throw new Error('Backup checksum does not match.');data=migrate(obj.data);save();state.selectedDate=latestDate();render();toast('Backup restored')}catch(err){toast(err.message)}e.target.value=''};

render();
})();
</script>
</body>
</html>
